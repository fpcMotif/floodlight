[workspace]
resolver = "2"
members = ["crates/floodlight_search", "crates/floodlight_gpui"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
floodlight_search = { path = "crates/floodlight_search" }
# One pin for the whole GPUI stack. Bump all three together: gpui_macos and
# gpui_platform are workspace siblings of gpui and assume the same tree.
gpui = { git = "https://github.com/zed-industries/zed", rev = "350f33871e84d5ed83a403523e9490b9bf014a94", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "350f33871e84d5ed83a403523e9490b9bf014a94", features = ["font-kit", "runtime_shaders"] }

# Zed patches async-task in its own workspace; a git dependency does not
# inherit [patch], so the same fork is named here or gpui's executor builds
# against a release that lacks what it calls.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
