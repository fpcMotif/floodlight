name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Floodlight
        uses: actions/checkout@v6

      - name: Build and upload the Astro site
        uses: withastro/action@v6
        with:
          path: ./docs
          node-version: 24
        env:
          PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_URL: https://floodlight.vmg.dev
          BASE_PATH: /

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
