name: Release Floodlight

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release

    steps:
      - name: Check out Floodlight
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release tag
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must use the form v1.2.3." >&2
            exit 1
          fi

      - name: Validate Apple signing secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=0
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            APPLE_APP_SPECIFIC_PASSWORD
          do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then
              echo "Missing required repository secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Set the app version from the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          plist="Sources/Floodlight/Resources/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $version" "$plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$plist"

      - name: Build Floodlight
        run: make bundle

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          intermediate_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          keychain_path="$RUNNER_TEMP/floodlight-signing.keychain-db"
          original_keychains_file="$RUNNER_TEMP/original-keychains.txt"

          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "ORIGINAL_KEYCHAINS_FILE=$original_keychains_file" \
            >> "$GITHUB_ENV"

          security list-keychains -d user \
            | sed -E 's/^[[:space:]]*"(.*)"$/\1/' \
            > "$original_keychains_file"
          original_keychains=()
          while IFS= read -r keychain; do
            if [ -n "$keychain" ]; then
              original_keychains+=("$keychain")
            fi
          done < "$original_keychains_file"

          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" \
            | base64 -D > "$certificate_path"
          curl -fsSL \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$intermediate_path"
          printf '%s  %s\n' \
            'f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a' \
            "$intermediate_path" \
            | shasum -a 256 -c -
          security create-keychain \
            -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain \
            -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" "${original_keychains[@]}"
          security import "$intermediate_path" \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain_path"

          identity=$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign Floodlight
        run: |
          codesign \
            --force \
            --keychain "$SIGNING_KEYCHAIN" \
            --sign "$CODE_SIGN_IDENTITY" \
            --identifier "com.floodlight.search" \
            --options runtime \
            --timestamp \
            .build/Floodlight.app
          codesign --verify --deep --strict --verbose=2 .build/Floodlight.app

      - name: Create and sign the DMG
        run: |
          ./scripts/create-dmg.sh
          codesign \
            --force \
            --keychain "$SIGNING_KEYCHAIN" \
            --sign "$CODE_SIGN_IDENTITY" \
            --timestamp \
            .build/Floodlight.dmg
          codesign --verify --verbose=2 .build/Floodlight.dmg

      - name: Notarize and staple the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit .build/Floodlight.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple .build/Floodlight.dmg
          xcrun stapler validate .build/Floodlight.dmg
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            .build/Floodlight.dmg

      - name: Remove signing credentials
        if: always()
        run: |
          if [ -f "${ORIGINAL_KEYCHAINS_FILE:-}" ]; then
            original_keychains=()
            while IFS= read -r keychain; do
              if [ -n "$keychain" ]; then
                original_keychains+=("$keychain")
              fi
            done < "$ORIGINAL_KEYCHAINS_FILE"
            security list-keychains -d user -s \
              "${original_keychains[@]}" || true
          fi
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          if [ -n "${ORIGINAL_KEYCHAINS_FILE:-}" ]; then
            rm -f "$ORIGINAL_KEYCHAINS_FILE"
          fi

      - name: Generate the checksum
        run: |
          cd .build
          shasum -a 256 Floodlight.dmg > Floodlight.dmg.sha256

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            .build/Floodlight.dmg \
            .build/Floodlight.dmg.sha256 \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Floodlight $version"
