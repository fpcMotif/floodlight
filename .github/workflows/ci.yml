name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - zig

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    name: Zig
    runs-on: xcode-27

    steps:
      - name: Check out Nanospot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore pinned Zig
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools
          key: nanospot-zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tool-versions.env') }}

      - name: Install pinned Zig
        run: make install-zig

      - name: Test, cross-build, and bench the core
        run: make test-core

      - name: Test, bundle, and snapshot the nanoui panel
        run: make test-nanoui
