id: search-path-no-full-sort
language: Swift
severity: error
message: >-
  Full sort in the search path — use bounded top-K selection via
  `SearchItemRanking.topRanked(_:limit:)` (or `SearchItemRanking.page(_:limit:)`
  when you also need `totalMatched`).
note: >-
  A catalog only ever shows a page. `matches.sorted(by:).prefix(limit)` orders
  every candidate and throws the tail away — O(n log n) where O(n log limit) was
  available, on every keystroke, over every installed application.
  `topRanked` keeps a heap of at most `limit` items and returns exactly what the
  full sort would have; `SearchItemRankingTests` asserts that equivalence, so
  swapping to it is not a behaviour change.

  `Catalog.swift` is exempt because it is the file that *defines* the published
  order — `ranked(_:)` is the full sort, and `topRanked` is built on it for the
  small-input and final-heap cases. If a second file ever needs to be exempt,
  that is a sign the ordering wants to move into `Catalog.swift`, not that the
  rule wants another exemption.

  A sort that is genuinely not on the query path — discovery ordering its
  results once per filesystem walk, say — takes a per-site
  `// ast-grep-ignore: search-path-no-full-sort` with the reason next to it.
  Per-site, because a whole-file exemption would also cover the query path that
  usually lives in the same file.
files:
  - "Sources/FloodlightEngine/Search/**/*.swift"
ignores:
  - "Sources/FloodlightEngine/Search/Catalog.swift"

# Matched as a member reference rather than as a call. `$CANDIDATES.sorted($$$)`
# only matches a parenthesised argument list, so `candidates.sorted { $0 < $1 }`
# — the shape anyone writes for a one-line comparator — slips straight through.
# That gap was live: `ApplicationCatalog.discoverApplications` sorts with a
# trailing closure and this rule did not see it.
rule:
  any:
    - pattern: $CANDIDATES.sorted
    - pattern: $CANDIDATES.sort
