id: readability-nesting-depth
snapshots:
  ? |
    func discover() {
        if isReady {
            for row in rows {
                switch row.kind {
                case .application:
                    row.candidates.map { candidate in
                        while candidate.hasMore {
                            candidate.advance()
                        }
                    }
                default:
                    break
                }
            }
        }
    }
