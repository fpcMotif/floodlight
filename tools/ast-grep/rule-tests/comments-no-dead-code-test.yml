    let panel = window as! FloodlightPanel
  - |
    // periphery:ignore
    func unusedProbe() {}
  - |
    // ast-grep-ignore: search-path-no-full-sort
    let ordered = applications.sorted()
  - |
    // swift-format-ignore
    let matrix = [1, 0, 0, 1]
