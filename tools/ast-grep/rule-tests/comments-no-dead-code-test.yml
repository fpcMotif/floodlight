id: comments-no-dead-code
valid:
  # The classic false red, and the reason the regex is not a keyword test: a
  # wrapped sentence whose continuation line starts with `for`. Copied
  # verbatim from ClipboardSourceApp.resolveDisplayName.
  - |
    private static func resolveDisplayName(for bundleID: String) -> String {
        // Before the lookup, not after it: these are the identifiers Launch
        // Services answers badly or not at all, so asking it first would pay
        // for an answer this table exists to override.
        if let known = knownNames[bundleID] { return known }
        return bundleID
    }
  # The second real one, from SourceSearchEngine.
  - |
    func snapshot() -> ([SearchItem], Provenance) {
        // The shell owns the final command/calculator/web merge and ranks the
        // complete list once. Sorting this partial list would repeat that work
        // for every progressive snapshot.
        return (items, provenance)
    }
  # A call named mid-sentence. The call shape has to be the whole line.
  - |
    // resolveDisplayName(for:) answers from knownNames before Launch Services.
    let name = resolveDisplayName(for: bundleID)
  # Doc comments pass even when they quote code.
  - |
    /// let ranked = matches.sorted()
    /// Use `SearchItemRanking.topRanked(_:limit:)` instead.
    func topRanked() {}
